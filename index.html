<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#1f2430; --sub:#6b7280; --line:#e5e7eb;
  --accent:#1e3a8a; --ok:#16a34a; --need:#dc2626; --done:#2563eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* ── 상단 ── */
header.top{background:var(--accent);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:17px;margin:0;line-height:1.2}
header .sub{font-size:12px;opacity:.8}
.me{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.demo{background:#fef3c7;color:#92400e;font-size:13px;padding:8px 16px;text-align:center}
.err{background:#fee2e2;color:#991b1b;font-size:13px;padding:8px 16px;text-align:center;display:none}
main{max-width:1100px;margin:0 auto;padding:14px 16px 40px}

/* ── 날짜 탭 ── */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-size:16px;font-weight:800;cursor:pointer;color:var(--ink)}
.tab small{display:block;font-weight:500;color:var(--sub);font-size:12px;margin-top:2px}
.tab.on{border-color:var(--accent);background:var(--accent);color:#fff}
.tab.on small{color:#c7d2fe}

/* ── 층 버튼 ── */
.floors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.floor{border:0;border-radius:16px;background:#fff;padding:18px 6px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:24px;font-weight:800;color:var(--ink)}
.floor .meta{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-top:6px}
.floor .meta b{color:var(--need)}
/* 층별 버튼 색깔: 1층 회색, 2층 연노란색, 3층 하늘색 */
.floor[data-f="1"]{background:#e5e7eb}
.floor[data-f="2"]{background:#fef9c3}
.floor[data-f="3"]{background:#bae6fd}
/* 선택한 층: 색은 그대로 두고 진한 테두리로 표시 */
.floor{border:3px solid transparent}
.floor.on{border-color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.25)}

/* ── 시설 카드 ── */
.panel{background:#fff;border-radius:16px;padding:6px 14px 16px;margin-bottom:22px}
.hint{color:var(--sub);text-align:center;padding:26px 0;font-size:14px}
.grp-title{font-size:13px;color:var(--sub);font-weight:700;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.fac{position:relative;border:0;border-radius:12px;padding:10px 10px 9px;color:#fff;text-align:left;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fac:active{transform:scale(.98)}
.fac .num{font-size:12px;font-weight:800;opacity:.85}
.fac .nm{font-size:14px;font-weight:700;line-height:1.3;margin:2px 26px 6px 0;word-break:keep-all}
.fac .last{font-size:11px;opacity:.92}
.badge{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1}
.badge.none{background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8)}
.badge.ok{color:var(--ok)} .badge.need{color:var(--need)} .badge.done{color:var(--done)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:12px}

/* ── 현황판 ── */
.board{background:#fff;border-radius:16px;padding:16px}
.board h2{font-size:18px;margin:0 0 12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-size:20px}
.sum span{font-size:12px;color:var(--sub)}
.sum .red b{color:var(--need)}
details.unchecked{font-size:13px;color:var(--sub);margin-bottom:12px}
details.unchecked summary{cursor:pointer}
details.unchecked p{margin:6px 0 0;line-height:1.6}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.filters select,.filters input{width:100%;padding:9px 8px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;font-family:inherit}
.search{margin-bottom:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.btn.gray{background:var(--bg);color:var(--ink)}
.btn.green{background:#15803d;color:#fff}
.btn.blue{background:var(--accent);color:#fff}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-size:12px;color:var(--sub);white-space:nowrap}
td.memo{white-space:pre-wrap;word-break:break-all}
.st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.st.ok{background:#dcfce7;color:#166534}.st.need{background:#fee2e2;color:#991b1b}.st.done{background:#dbeafe;color:#1e40af}
.del{background:none;border:0;color:#9ca3af;cursor:pointer;font-size:13px}
.empty{color:var(--sub);text-align:center;padding:20px}

/* 모바일용 기록 카드 (PC에서는 표, 휴대폰에서는 카드) */
.cards{display:none}
.rec{border:1px solid var(--line);border-left:5px solid var(--sub);border-radius:12px;padding:11px 12px;margin-bottom:8px;background:#fff}
.rec.ok{border-left-color:var(--ok)}
.rec.need{border-left-color:var(--need);background:#fff7f7}
.rec.done{border-left-color:var(--done)}
.rec .r1{display:flex;align-items:center;gap:8px}
.rec .fname{font-size:16px;font-weight:800;flex:1;min-width:0;word-break:keep-all}
.rec .time{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.rec .memo{font-size:15px;line-height:1.5;margin:7px 0 8px;white-space:pre-wrap;word-break:break-all}
.rec .memo.plain{color:var(--sub);font-size:14px}
.rec .r3{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub)}
.rec .del{padding:4px 2px}

@media (max-width:640px){
  .filters{grid-template-columns:1fr 1fr}
  .table-wrap{display:none}
  .cards{display:block}
}

/* ── 입력창(모달) ── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.modal{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 16px}
@media (min-width:641px){.overlay{align-items:center}.modal{border-radius:18px}}
.mhead{padding:14px 16px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mhead h3{margin:0;font-size:18px}
.mhead small{opacity:.9}
.x{background:rgba(255,255,255,.25);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.mbody{padding:14px 16px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}
.mbody input,.mbody textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
.mbody textarea{min-height:76px;resize:vertical}
.stbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stbtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:11px 4px;font-size:15px;font-weight:800;cursor:pointer;color:var(--ink)}
.stbtn.ok.on{border-color:var(--ok);background:#dcfce7;color:#166534}
.stbtn.need.on{border-color:var(--need);background:#fee2e2;color:#991b1b}
.stbtn.done.on{border-color:var(--done);background:#dbeafe;color:#1e40af}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.save{width:100%;margin-top:14px;padding:14px;font-size:16px}
.save:disabled{opacity:.5}
.hist{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px}
.hist h4{margin:0 0 6px;font-size:13px;color:var(--sub)}
.hist div{padding:5px 0;border-bottom:1px solid var(--bg);line-height:1.5}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ── 인쇄 ── */
#printHead{display:none}
@media print{
  body{background:#fff}
  header.top,.demo,.err,.tabs,.floors,.panel,.filters,.search,.actions,.sum,details.unchecked,.board h2,.del,.overlay,.toast{display:none!important}
  main{padding:0;max-width:none}
  .board{padding:0}
  #printHead{display:block;margin-bottom:10px}
  #printHead h1{font-size:18px;margin:0 0 4px}
  #printHead p{font-size:12px;margin:0;color:#444}
  table{font-size:11px}
  th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cards{display:none!important}
  .table-wrap{display:block!important}
  td,th{padding:5px 6px}
  tr{page-break-inside:avoid}
}
</style>
</head>

<header class="top">
  <div>
    <h1>정약용RAS 락랑페스타</h1>

<script type="module">
/* =========================================================

const firebaseConfig = {
  apiKey: "AIzaSyBVkVe13kD7Mi43K-1BpMR812XC1HbP5Qc",
  authDomain: "rockrang-77792.firebaseapp.com",
  projectId: "rockrang-77792",
  storageBucket: "rockrang-77792.firebasestorage.app",
  messagingSenderId: "535828813510",
  appId: "1:535828813510:web:0fdd39c90d3bcde15329c7"
};

/* =========================================================

const DATES = [
  { id: "2026-10-23", label: "10/23(금)", sub: "사전 점검" },
  { id: "2026-10-24", label: "10/24(토)", sub: "행사 당일" },
];

const COLOR = {
  purple: "#7c3aed", red: "#dc2626", green: "#15803d",
  ops: "#1e3a8a", food: "#ea580c", wc: "#64748b", rest: "#0f766e",
};

const BOOTH_NAMES = [
  "", // 0번 자리(사용 안 함)
  "영재 - 산출물", "영재 - 라탄방진", "영재 - 마이크로비트", "영재 - 태양광, 스마트팜",
  "영재 - 마이크로비트(중등) 게임", "업사이클 마트", "탄소중립 과학체험",
  "국제교류동아리 Ⅰ", "국제교류동아리 Ⅱ", "지역 축제 레벨업", "감정코칭",
  "폰 OFF, RAS ON", "키즈가드닝(돌봄)", "책놀이터", "왕실탐험대", "지구살림 프로젝트",
  "수동별나라", "나도 앵커다", "겟잇뷰티", "배구 임파서블", "스마트팜 창업", "수학부스",
  "보석감별사", "레고월드", "전통공예", "컵케이크", "슬라임만들기", "드론", "3D 메이커",
  "그래비티 렉스 스튜디오", "생각쑥쑥 3D", "인공지능 로봇과 춤을", "자연향기 키즈가드닝",

];

const FAC = [];
const add = (floor, id, name, color, group, num = "") => FAC.push({ floor, id, name, color, group, num });

// 1층
add(1, "1F-parking", "주차관리", COLOR.ops, "운영");
add(1, "1F-hq", "운영본부", COLOR.ops, "운영");

add(1, "1F-wc-m", "화장실(남)", COLOR.wc, "편의시설");

// 2층: 1~9번 부스(보라)
for (let n = 1; n <= 9; n++) add(2, `B${n}`, BOOTH_NAMES[n], COLOR.purple, "부스", n);
add(2, "2F-wc-m", "화장실(남)", COLOR.wc, "편의시설");

// 3층: 10~27번(빨강), 28~35번(녹색)
for (let n = 10; n <= 35; n++) add(3, `B${n}`, BOOTH_NAMES[n], n <= 27 ? COLOR.red : COLOR.green, "부스", n);
add(3, "3F-rest", "지원단 휴게실", COLOR.rest, "편의시설");
add(3, "3F-wc-w-m", "서편 화장실(남)", COLOR.wc, "편의시설");
add(3, "3F-wc-w-f", "서편 화장실(여)", COLOR.wc, "편의시설");
add(3, "3F-wc-e-m", "동편 화장실(남)", COLOR.wc, "편의시설");
add(3, "3F-wc-e-f", "동편 화장실(여)", COLOR.wc, "편의시설");

const FAC_INDEX = Object.fromEntries(FAC.map((f, i) => [f.id, i]));
const STATUS = {
  ok:   { label: "이상없음", icon: "✓" },
  need: { label: "조치필요", icon: "!" },
  done: { label: "조치완료", icon: "✓" },
};
const QUICK = ["책상·의자 추가 필요", "전기·콘센트 확인 필요", "청소 필요", "소모품 보충 필요", "안내 표지판 필요", "휴지 보충 필요"];

/* =========================================================
   ③ 저장소 — Firebase(실제) 또는 체험 모드(이 기기)
      화면 코드는 어느 쪽이든 subscribe/add/remove만 부릅니다.
   ========================================================= */
const DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes("여기에");

function demoStore() {
  const KEY = "rakrang_demo_records";
  let mem = [];
  try { mem = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
  const subs = [];
  const emit = () => {
    try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
    subs.forEach(cb => cb([...mem]));
  };
  return {
    subscribe(cb) { subs.push(cb); cb([...mem]); },
    async add(r) { mem.push({ ...r, id: "d" + Date.now() + Math.random().toString(36).slice(2, 6) }); emit(); },
    async remove(id) { mem = mem.filter(x => x.id !== id); emit(); },
  };
}

async function firebaseStore() {
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const col = fs.collection(db, "checks");
  return {
    subscribe(cb) {
      // onSnapshot: 누군가 기록을 추가·삭제하면 모든 기기 화면이 자동으로 바뀝니다.
      fs.onSnapshot(fs.query(col, fs.orderBy("ts", "desc")),
        snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
        err => showError("데이터를 불러오지 못했습니다: " + err.message));
    },
    add: r => fs.addDoc(col, r),
    remove: id => fs.deleteDoc(fs.doc(db, "checks", id)),
  };
}

/* =========================================================
   ④ 화면 상태와 그리기
   ========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dateLabel = id => (DATES.find(d => d.id === id) || {}).label || id;

const TEACHER_KEY = "rakrang_teacher";
let teacher = "";
try { teacher = localStorage.getItem(TEACHER_KEY) || ""; } catch (e) {}
function setTeacher(name) {
  teacher = name.trim();
  try { localStorage.setItem(TEACHER_KEY, teacher); } catch (e) {}
  $("meBtn").textContent = teacher ? `👤 ${teacher} · 변경` : "점검자 설정";
}

const state = {
  date: todayStr() >= DATES[1].id ? DATES[1].id : DATES[0].id,
  floor: null,
  records: [],
  f: { date: null, floor: "all", status: "all", sort: "new", q: "" },
};
state.f.date = state.date;

// 같은 날짜·시설 기록 중 확인시각이 가장 늦은 것 = 현재 상태
function latest(facId, date) {
  let best = null;
  for (const r of state.records) {
    if (r.facilityId !== facId || r.date !== date) continue;
    if (!best || r.checkTime > best.checkTime || (r.checkTime === best.checkTime && r.ts > best.ts)) best = r;
  }
  return best;
}

function renderTabs() {
  $("tabs").innerHTML = DATES.map(d =>
    `<button class="tab ${d.id === state.date ? "on" : ""}" data-d="${d.id}">${d.label}<small>${d.sub}</small></button>`).join("");
}

function renderFloors() {
  $("floors").innerHTML = [1, 2, 3].map(fl => {
    const list = FAC.filter(f => f.floor === fl);
    let checked = 0, need = 0;
    list.forEach(f => { const l = latest(f.id, state.date); if (l) { checked++; if (l.status === "need") need++; } });
    return `<button class="floor ${state.floor === fl ? "on" : ""}" data-f="${fl}">${fl}층
      <span class="meta">${checked}/${list.length} 점검${need ? ` · <b>⚠ ${need}</b>` : ""}</span></button>`;
  }).join("");
}

function renderPanel() {
  if (!state.floor) { $("panel").innerHTML = `<p class="hint">층을 선택하면 시설 목록이 나옵니다.</p>`; return; }
  const list = FAC.filter(f => f.floor === state.floor);
  const groups = [...new Set(list.map(f => f.group))];
  $("panel").innerHTML = groups.map(g => `
    <div class="grp-title">${g}</div>
    <div class="grid">${list.filter(f => f.group === g).map(f => {
      const l = latest(f.id, state.date);
      const st = l ? l.status : "none";
      return `<button class="fac" style="background:${f.color}" data-id="${f.id}">
        <span class="badge ${st}">${l ? STATUS[st].icon : ""}</span>
        <span><div class="num">${f.num ? f.num + "번 부스" : "&nbsp;"}</div><div class="nm">${esc(f.name)}</div></span>
        <span class="last">${l ? `최종 ${l.checkTime} · ${esc(l.teacher)}` : "미점검"}</span>
      </button>`; }).join("")}</div>`).join("") +
    `<div class="legend"><span>⚪ 미점검</span><span style="color:var(--ok)">✓ 이상없음</span><span style="color:var(--need)">! 조치필요</span><span style="color:var(--done)">✓ 조치완료</span></div>`;
}

function filtered() {
  const { date, floor, status, sort, q } = state.f;
  const kw = q.trim().toLowerCase();
  let rows = state.records.filter(r =>
    (date === "all" || r.date === date) &&
    (floor === "all" || String(r.floor) === floor) &&
    (status === "all" || r.status === status) &&
    (!kw || `${r.facilityName} ${r.teacher} ${r.memo}`.toLowerCase().includes(kw)));
  const byNew = (a, b) => b.date.localeCompare(a.date) || b.checkTime.localeCompare(a.checkTime) || b.ts - a.ts;
  if (sort === "new") rows.sort(byNew);
  if (sort === "need") rows.sort((a, b) => (b.status === "need") - (a.status === "need") || byNew(a, b));
  if (sort === "fac") rows.sort((a, b) => a.date.localeCompare(b.date) || (FAC_INDEX[a.facilityId] ?? 999) - (FAC_INDEX[b.facilityId] ?? 999) || a.checkTime.localeCompare(b.checkTime));
  return rows;
}

function renderBoard() {
  // 요약은 '날짜' 필터 기준(전체면 지금 선택한 날짜 탭 기준)
  const d = state.f.date === "all" ? state.date : state.f.date;
  const facs = FAC.filter(f => state.f.floor === "all" || String(f.floor) === state.f.floor);
  const unchecked = [], needs = [];
  facs.forEach(f => { const l = latest(f.id, d); if (!l) unchecked.push(f); else if (l.status === "need") needs.push(f); });
  const rows = filtered();
  $("sum").innerHTML = `
    <div><b>${facs.length - unchecked.length}/${facs.length}</b><span>점검한 시설 (${dateLabel(d)})</span></div>
    <div class="red"><b>${needs.length}</b><span>현재 조치필요</span></div>
    <div><b>${rows.length}</b><span>표시된 기록</span></div>`;
  const nm = f => (f.num ? f.num + "번 " : `${f.floor}층 `) + f.name;
  $("unchecked").innerHTML = unchecked.length
    ? `<summary>아직 점검하지 않은 시설 ${unchecked.length}곳 보기</summary><p>${unchecked.map(f => esc(nm(f))).join(" · ")}</p>`
    : `<summary>모든 시설 점검 완료 🎉</summary>`;

  if (!rows.length) { $("list").innerHTML = `<p class="empty">조건에 맞는 점검 기록이 없습니다.</p>`; return; }

  // 휴대폰: 한 기록 = 카드 한 장 (시설명·시각 → 확인내용 → 날짜·층·교사 순서로 중요한 것부터)
  const cards = rows.map(r => {
    const plain = r.status === "ok" && (!r.memo || r.memo === "이상없음");
    return `<div class="rec ${r.status}">
      <div class="r1"><span class="st ${r.status}">${STATUS[r.status]?.label || r.status}</span>
        <span class="fname">${esc(r.facilityName)}</span><span class="time">${esc(r.checkTime)}</span></div>
      <div class="memo ${plain ? "plain" : ""}">${esc(r.memo) || "-"}</div>
      <div class="r3"><span>${dateLabel(r.date)} · ${r.floor}층 · ${esc(r.teacher)}</span>
        <button class="del" data-del="${r.id}">삭제</button></div>
    </div>`;
  }).join("");

  $("list").innerHTML = `<div class="cards">${cards}</div><div class="table-wrap"><table>
    <thead><tr><th>날짜</th><th>시각</th><th>층</th><th>시설</th><th>상태</th><th>확인내용</th><th>확인교사</th><th class="del"></th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td data-l="날짜">${dateLabel(r.date)}</td>
      <td data-l="시각">${esc(r.checkTime)}</td>
      <td data-l="층">${r.floor}층</td>
      <td data-l="시설"><b>${esc(r.facilityName)}</b></td>
      <td data-l="상태"><span class="st ${r.status}">${STATUS[r.status]?.label || r.status}</span></td>
      <td data-l="확인내용" class="memo">${esc(r.memo) || "-"}</td>
      <td data-l="확인교사">${esc(r.teacher)}</td>
      <td class="del-cell"><button class="del" data-del="${r.id}">삭제</button></td>
    </tr>`).join("")}</tbody></table></div>`;
}

function renderAll() { renderTabs(); renderFloors(); renderPanel(); renderBoard(); }

/* =========================================================
   ⑤ 점검 입력창
   ========================================================= */
let current = null, chosen = null;

function openModal(facId) {
  current = FAC.find(f => f.id === facId);
  chosen = null;
  const hist = state.records.filter(r => r.facilityId === facId && r.date === state.date)
    .sort((a, b) => b.checkTime.localeCompare(a.checkTime));
  $("modal").innerHTML = `
    <div class="mhead" style="background:${current.color}">
      <div><small>${current.floor}층 · ${dateLabel(state.date)}</small><h3>${current.num ? current.num + "번 " : ""}${esc(current.name)}</h3></div>
      <button class="x" id="mClose">✕</button>
    </div>
    <div class="mbody">
      <div class="row">
        <div><label class="f">확인시각</label><input type="time" id="mTime" value="${nowHM()}"></div>
        <div><label class="f">확인교사</label><input id="mTeacher" value="${esc(teacher)}" placeholder="이름" maxlength="30"></div>
      </div>
      <label class="f">점검 결과</label>
      <div class="stbtns">${Object.entries(STATUS).map(([k, v]) => `<button class="stbtn ${k}" data-st="${k}">${v.label}</button>`).join("")}</div>
      <label class="f">확인내용 <span id="memoReq" style="color:var(--need);font-weight:500"></span></label>
      <textarea id="mMemo" maxlength="500" placeholder="예) 의자 10개 추가 필요 / 이상 없음"></textarea>
      <div class="chips">${QUICK.map(q => `<button class="chip" data-q="${q}">+ ${q}</button>`).join("")}</div>
      <button class="btn blue save" id="mSave" disabled>저장하기</button>
      <div class="hist"><h4>이 시설의 오늘 기록 (${hist.length}건)</h4>
        ${hist.length ? hist.map(r => `<div><span class="st ${r.status}">${STATUS[r.status].label}</span> ${r.checkTime} · ${esc(r.teacher)}${r.memo ? " — " + esc(r.memo) : ""}</div>`).join("") : `<div style="color:var(--sub)">아직 기록이 없습니다.</div>`}
      </div>
    </div>`;
  $("overlay").classList.add("on");
  validate();
}
function closeModal() { $("overlay").classList.remove("on"); current = null; }

function validate() {
  const memoNeeded = chosen === "need";
  $("memoReq").textContent = memoNeeded ? "* 조치필요는 내용을 꼭 적어주세요" : "";
  const ok = chosen && $("mTeacher").value.trim() && $("mTime").value && (!memoNeeded || $("mMemo").value.trim());
  $("mSave").disabled = !ok;
}

async function save() {
  const name = $("mTeacher").value.trim();
  const rec = {
    date: state.date,
    floor: current.floor,
    facilityId: current.id,
    facilityName: (current.num ? current.num + "번 " : "") + current.name,
    status: chosen,
    memo: $("mMemo").value.trim() || (chosen === "ok" ? "이상없음" : ""),
    teacher: name,
    checkTime: $("mTime").value,
    ts: Date.now(),
  };
  $("mSave").disabled = true;
  try {
    await store.add(rec);
    if (name !== teacher) setTeacher(name);   // 처음 입력한 이름을 이 기기에 기억
    closeModal();
    toast("저장되었습니다");
  } catch (e) {
    toast("저장 실패: " + e.message);
    $("mSave").disabled = false;
  }
}

/* =========================================================
   ⑥ 인쇄·엑셀 — 지금 걸려 있는 필터 그대로 출력
   ========================================================= */
function filterText() {
  const f = state.f;
  return [
    f.date === "all" ? "전체 날짜" : dateLabel(f.date),
    f.floor === "all" ? "전체 층" : f.floor + "층",
    f.status === "all" ? "전체 상태" : STATUS[f.status].label,
    f.q ? `검색: ${f.q}` : "",
  ].filter(Boolean).join(" · ");
}
function stamp() { const d = new Date(); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`; }

function printList() {
  const d = new Date();
  $("printInfo").textContent = `${filterText()}  |  출력: ${d.getMonth() + 1}/${d.getDate()} ${nowHM()}  |  ${filtered().length}건`;
  window.print();
}

function exportExcel() {
  const rows = filtered();
  if (!rows.length) return toast("내보낼 기록이 없습니다");
  if (typeof XLSX === "undefined") return toast("엑셀 도구를 불러오지 못했습니다");
  const data = rows.map(r => ({
    "날짜": dateLabel(r.date), "확인시각": r.checkTime, "층": r.floor + "층", "시설": r.facilityName,
    "상태": STATUS[r.status]?.label || r.status, "확인내용": r.memo, "확인교사": r.teacher,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws["!cols"] = [{ wch: 11 }, { wch: 8 }, { wch: 5 }, { wch: 28 }, { wch: 9 }, { wch: 40 }, { wch: 10 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "점검기록");
  XLSX.writeFile(wb, `락랑페스타_현장점검_${stamp()}.xlsx`);
}

/* =========================================================
   ⑦ 버튼 연결
   ========================================================= */
let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 1800); }
function showError(msg) { const e = $("errBar"); e.textContent = msg; e.style.display = "block"; }

function fillDateFilter() {
  $("fDate").innerHTML = `<option value="all">전체 날짜</option>` + DATES.map(d => `<option value="${d.id}">${d.label}</option>`).join("");
  $("fDate").value = state.f.date;
}

$("tabs").onclick = e => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  state.date = b.dataset.d; state.f.date = b.dataset.d; $("fDate").value = state.f.date; renderAll();
};
$("floors").onclick = e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  state.floor = Number(b.dataset.f); renderFloors(); renderPanel();
};
$("panel").onclick = e => { const b = e.target.closest("[data-id]"); if (b) openModal(b.dataset.id); };

$("overlay").onclick = e => { if (e.target.id === "overlay") closeModal(); };
$("modal").onclick = e => {
  if (e.target.id === "mClose") return closeModal();
  if (e.target.id === "mSave") return save();
  const st = e.target.closest("[data-st]");
  if (st) {
    chosen = st.dataset.st;
    document.querySelectorAll(".stbtn").forEach(b => b.classList.toggle("on", b === st));
    validate();
  }
  const q = e.target.closest("[data-q]");
  if (q) { const m = $("mMemo"); m.value = (m.value.trim() ? m.value.trim() + ", " : "") + q.dataset.q; validate(); }
};
$("modal").oninput = validate;

["fDate", "fFloor", "fStatus", "fSort"].forEach(id => $(id).onchange = () => {
  state.f[{ fDate: "date", fFloor: "floor", fStatus: "status", fSort: "sort" }[id]] = $(id).value; renderBoard();
});
$("fQ").oninput = () => { state.f.q = $("fQ").value; renderBoard(); };
$("list").onclick = async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  const r = state.records.find(x => x.id === b.dataset.del);
  if (r && confirm(`${r.facilityName} ${r.checkTime} 기록을 삭제할까요?`)) {
    try { await store.remove(r.id); toast("삭제했습니다"); } catch (err) { toast("삭제 실패: " + err.message); }
  }
};
$("printBtn").onclick = printList;
$("xlsBtn").onclick = exportExcel;
$("meBtn").onclick = () => { const n = prompt("점검자 이름을 입력하세요", teacher); if (n !== null && n.trim()) { setTeacher(n); toast("점검자: " + teacher); } };

/* =========================================================
   ⑧ 시작
   ========================================================= */
setTeacher(teacher);
fillDateFilter();
renderAll();

let store;
try {
  store = DEMO ? demoStore() : await firebaseStore();
  if (DEMO) $("demoBar").style.display = "block";
  store.subscribe(recs => { state.records = recs; renderAll(); });
} catch (e) {
  showError("Firebase 연결 실패: " + e.message);
}
</script>
</body>
</html>
